---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/apps/longhorn-system/longhorn-config/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # RecurringJob CRD comes from the longhorn HelmRelease.
    - name: longhorn
