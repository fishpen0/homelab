apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      # The grafana/tempo chart is deprecated; it moved to grafana-community.
      chart: tempo
      version: "3.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  values:
    tempo:
      retention: 72h
      # Span metrics + service graph feed the Traces drilldown RED views.
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write
        processor:
          service_graphs: {}
          span_metrics: {}
        storage:
          path: /var/tempo/metrics
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
      # OTLP in; the chart still renders its default jaeger listeners (templates require them).
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

    persistence:
      enabled: true
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      size: 10Gi

    serviceMonitor:
      enabled: true
      # Prometheus only selects ServiceMonitors carrying this release label.
      additionalLabels:
        release: kube-prometheus-stack
