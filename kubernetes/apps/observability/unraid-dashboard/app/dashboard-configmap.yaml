apiVersion: v1
kind: ConfigMap
metadata:
  name: unraid-grafana-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  unraid-dashboard.json: |
    {
      "uid": "unraid-box",
      "title": "Unraid (box)",
      "tags": [
        "unraid"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "CPU used",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{source=\"unraid\",mode=\"idle\"}[$__rate_interval]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Memory used",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "1 - node_memory_MemAvailable_bytes{source=\"unraid\"} / node_memory_MemTotal_bytes{source=\"unraid\"}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.92
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Load (1m)",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "node_load1{source=\"unraid\"}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": null,
              "max": null,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Uptime",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "time() - node_boot_time_seconds{source=\"unraid\"}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": null,
              "max": null,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Max temp",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "expr": "max(node_hwmon_temp_celsius{source=\"unraid\"})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": null,
              "max": null,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Containers logging",
          "id": 7,
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(count by (container) (count_over_time({source=\"unraid\",job=\"docker\"}[15m])))",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": null,
              "max": null,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "row",
          "title": "CPU, memory, load",
          "id": 8,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU by mode",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{source=\"unraid\",mode!=\"idle\"}[$__rate_interval])) / count(count by (cpu) (node_cpu_seconds_total{source=\"unraid\"}))",
              "legendFormat": "{{mode}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "fillOpacity": 40,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Memory",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{source=\"unraid\"}-node_memory_MemAvailable_bytes{source=\"unraid\"}",
              "legendFormat": "used",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "node_memory_Cached_bytes{source=\"unraid\"}",
              "legendFormat": "page cache",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "node_memory_MemTotal_bytes{source=\"unraid\"}",
              "legendFormat": "total",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Load average",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "expr": "node_load1{source=\"unraid\"}",
              "legendFormat": "1m",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "node_load5{source=\"unraid\"}",
              "legendFormat": "5m",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "node_load15{source=\"unraid\"}",
              "legendFormat": "15m",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Temperatures (hwmon)",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "expr": "node_hwmon_temp_celsius{source=\"unraid\"}",
              "legendFormat": "{{chip}} {{sensor}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Storage",
          "id": 13,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Filesystem used (array, cache, flash)",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "expr": "1 - node_filesystem_avail_bytes{source=\"unraid\",mountpoint=~\"/mnt/(disk[0-9]+|cache)|/boot|/var/lib/docker\"} / node_filesystem_size_bytes{source=\"unraid\",mountpoint=~\"/mnt/(disk[0-9]+|cache)|/boot|/var/lib/docker\"}",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.92
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Disk throughput",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "expr": "sum by (device) (rate(node_disk_read_bytes_total{source=\"unraid\"}[$__rate_interval]))",
              "legendFormat": "{{device}} read",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "-sum by (device) (rate(node_disk_written_bytes_total{source=\"unraid\"}[$__rate_interval]))",
              "legendFormat": "{{device}} write",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Disk busy (io time)",
          "id": 16,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "rate(node_disk_io_time_seconds_total{source=\"unraid\"}[$__rate_interval])",
              "legendFormat": "{{device}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Free space by mount",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{source=\"unraid\",mountpoint=~\"/mnt/(disk[0-9]+|cache)\"}",
              "legendFormat": "{{mountpoint}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Network",
          "id": 18,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Throughput by interface",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 41
          },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{source=\"unraid\",device!~\"lo|veth.*|docker.*|br-.*|virbr.*\"}[$__rate_interval])",
              "legendFormat": "{{device}} rx",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "-rate(node_network_transmit_bytes_total{source=\"unraid\",device!~\"lo|veth.*|docker.*|br-.*|virbr.*\"}[$__rate_interval])",
              "legendFormat": "{{device}} tx",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "TCP connections / retransmits",
          "id": 20,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 41
          },
          "targets": [
            {
              "expr": "node_netstat_Tcp_CurrEstab{source=\"unraid\"}",
              "legendFormat": "established",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "rate(node_netstat_Tcp_RetransSegs{source=\"unraid\"}[$__rate_interval])",
              "legendFormat": "retrans/s",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": null,
              "max": null,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Logs (Loki)",
          "id": 21,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 49
          },
          "panels": []
        },
        {
