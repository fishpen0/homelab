---
# Pulls the MariaDB credentials from two 1Password Password-category items in the
# Homelab vault. Both items hold their secret in the default `password` field —
# see MEMORY.md "1Password Item Conventions" for rationale.
#
# Required 1Password items (create manually before applying):
#   Vault: Homelab
#   Items:
#     - grimmory-database-password        (Password category) — any strong random password
#     - grimmory-database-root-password   (Password category) — any strong random password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-cluster
    kind: ClusterSecretStore
  target:
    name: grimmory-secrets
    creationPolicy: Owner
  data:
    # Consumed by the grimmory container (spring.datasource.password).
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: grimmory-database-password
        property: password
    # Same value, second env var name so the MariaDB image picks it up via envFrom.
    - secretKey: MARIADB_PASSWORD
      remoteRef:
        key: grimmory-database-password
        property: password
    - secretKey: MARIADB_ROOT_PASSWORD
      remoteRef:
        key: grimmory-database-root-password
        property: password
