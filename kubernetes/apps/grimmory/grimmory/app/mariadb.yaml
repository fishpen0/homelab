---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory-mariadb
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      mariadb:
        strategy: Recreate
        containers:
          mariadb:
            image:
              repository: mariadb
              tag: "11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15"
            env:
              MARIADB_DATABASE: grimmory
              MARIADB_USER: grimmory
            envFrom:
              # Provides MARIADB_PASSWORD + MARIADB_ROOT_PASSWORD (and
              # DATABASE_PASSWORD, ignored here).
              - secretRef:
                  name: grimmory-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          enableServiceLinks: false
    service:
      mariadb:
        controller: mariadb
        ports:
          mariadb:
            port: 3306
    persistence:
      data:
        existingClaim: grimmory-mariadb-data
        globalMounts:
          - path: /var/lib/mysql
