---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold-postgres
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      postgres:
        strategy: Recreate
        containers:
          postgres:
            image:
              # UPGRADE BOOT (PG17 -> PG18) -- TEMPORARY, revert to postgres:18.6-trixie
              # once `select version()` reports 18. Runs `pg_upgrade --link` in place.
              # DELETES the old cluster on success; snapshot manyfold-pg17-pre-upgrade
              # is the rollback point.
              repository: pgautoupgrade/pgautoupgrade
              tag: "18-trixie@sha256:505411c0e6fd94ac7a454de31f13e3063ebfe382f8e5a18affeb89dd052058ff"
            env:
              POSTGRES_USER: manyfold
              POSTGRES_DB: manyfold
              # DO NOT REMOVE. PG18+ images default to PGDATA=/var/lib/postgresql/18/docker
              # with VOLUME=/var/lib/postgresql. Our data lives at the pre-18 path, so this
              # explicit override is what keeps PG18 pointed at it. Drop this line and PG18
              # finds an empty dir, runs initdb, and manyfold comes up against a blank
              # database. Explicit PGDATA is fully supported upstream -- keep it.
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  # Provides POSTGRES_PASSWORD (and DATABASE_PASSWORD, ignored here)
                  name: manyfold-secrets
            probes:
              # Disabled for the UPGRADE BOOT ONLY.
              liveness:
                enabled: false
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: false
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 2Gi
        pod:
          enableServiceLinks: false
    service:
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: manyfold-postgres-data
        globalMounts:
          - path: /var/lib/postgresql/data
