---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold-postgres
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      postgres:
        strategy: Recreate
        containers:
          postgres:
            image:
              # PG17, upgraded in place 15.10 -> 16 -> 17 on 2026-08-30 via
              # pgautoupgrade (pg_upgrade --link). Keep a trixie-based tag: the data
              # was reindexed under glibc 2.41, so a bookworm image (2.36) would
              # reintroduce a collation version mismatch on text indexes.
              repository: postgres
              tag: "17.11-trixie@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
            env:
              POSTGRES_USER: manyfold
              POSTGRES_DB: manyfold
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  # Provides POSTGRES_PASSWORD (and DATABASE_PASSWORD, ignored here)
                  name: manyfold-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          enableServiceLinks: false
    service:
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: manyfold-postgres-data
        globalMounts:
          - path: /var/lib/postgresql/data
