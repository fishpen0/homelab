---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold-postgres
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      postgres:
        strategy: Recreate
        containers:
          postgres:
            image:
              # UPGRADE BOOT (PG16 -> PG17) -- TEMPORARY, revert to postgres:17.11-trixie
              # once `select version()` reports 17. Runs `pg_upgrade --link` in place
              # on first start. DELETES the old cluster on success; snapshot
              # manyfold-pg16-pre-upgrade is the rollback point.
              repository: pgautoupgrade/pgautoupgrade
              tag: "17-trixie@sha256:dcce7833c4ca3420e7fe51de73bd01bc149031b43bfc9510391f590833bfd56b"
            env:
              POSTGRES_USER: manyfold
              POSTGRES_DB: manyfold
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  # Provides POSTGRES_PASSWORD (and DATABASE_PASSWORD, ignored here)
                  name: manyfold-secrets
            probes:
              # Both disabled for the UPGRADE BOOT ONLY -- pg_isready fails while
              # pg_upgrade runs, and a restart part-way through corrupts --link.
              liveness:
                enabled: false
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: false
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                # Raised for the upgrade boot (reindex); back to 512Mi after.
                memory: 2Gi
        pod:
          enableServiceLinks: false
    service:
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: manyfold-postgres-data
        globalMounts:
          - path: /var/lib/postgresql/data
