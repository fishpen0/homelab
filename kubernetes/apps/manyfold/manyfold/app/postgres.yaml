---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold-postgres
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      postgres:
        strategy: Recreate
        containers:
          postgres:
            image:
              # PG16, upgraded in place from 15.10 on 2026-08-30 via pgautoupgrade
              # (pg_upgrade --link). Stay on a trixie-based tag: the data was
              # reindexed and had its collation version refreshed under glibc 2.41,
              # so a bookworm image (2.36) would reintroduce a collation mismatch.
              repository: postgres
              tag: "16.15-trixie@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94"
            env:
              POSTGRES_USER: manyfold
              POSTGRES_DB: manyfold
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  # Provides POSTGRES_PASSWORD (and DATABASE_PASSWORD, ignored here)
                  name: manyfold-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          enableServiceLinks: false
    service:
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: manyfold-postgres-data
        globalMounts:
          - path: /var/lib/postgresql/data
