---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold-postgres
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1h
  values:
    controllers:
      postgres:
        strategy: Recreate
        containers:
          postgres:
            image:
              # PG18, upgraded in place 15.10 -> 16 -> 17 -> 18 on 2026-08-30 via
              # pgautoupgrade (pg_upgrade --link). Keep a trixie-based tag: the data was
              # reindexed under glibc 2.41, so a bookworm image (2.36) would reintroduce
              # a collation version mismatch on text indexes. See PGDATA note below --
              # it is load-bearing on 18+.
              repository: postgres
              tag: "18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
            env:
              POSTGRES_USER: manyfold
              POSTGRES_DB: manyfold
              # DO NOT REMOVE. PG18+ images default to PGDATA=/var/lib/postgresql/18/docker
              # with VOLUME=/var/lib/postgresql. Our data lives at the pre-18 path, so this
              # explicit override is what keeps PG18 pointed at it. Drop this line and PG18
              # finds an empty dir, runs initdb, and manyfold comes up against a blank
              # database. Explicit PGDATA is fully supported upstream -- keep it.
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  # Provides POSTGRES_PASSWORD (and DATABASE_PASSWORD, ignored here)
                  name: manyfold-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          enableServiceLinks: false
    service:
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: manyfold-postgres-data
        globalMounts:
          - path: /var/lib/postgresql/data
